version: 2

models:

  - name: inventory_position
    description: >
      Current stock per product — derived from all movements
      (purchases minus sales plus returns). Never manually entered.
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: stock_on_hand
        description: "total_purchased - total_sold + total_returned"
      - name: needs_reorder
        description: "TRUE when stock_on_hand <= reorder_level"

  - name: daily_sales_summary
    description: >
      One row per (day, business unit). Powers all time-series charts and
      can be filtered or broken down by unit in Looker Studio.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - sale_date
            - unit
    columns:
      - name: sale_date
        tests: [not_null]
      - name: unit
        description: "Business unit/branch. NULL for sales recorded before this field existed."

  - name: product_performance
    description: >
      Per-variant, per-month sales, revenue, and accurate gross profit.
      One row per (month, product_key) — always all active products, for
      every month with any activity plus the current month.
      Profit uses cost_price from stg_products (entered in Product Master Form)
      — exact margin per variant, not an approximation.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - month
            - product_key
    columns:
      - name: month
        tests: [not_null]
      - name: product_key
        tests: [not_null]
      - name: product_family
        description: "e.g. 'Locks' from 'Locks - Moment'"
      - name: product_variant
        description: "e.g. 'Moment' from 'Locks - Moment'"
      - name: total_gross_profit
        description: "Revenue - COGS (using actual cost price) - returns value, for that month"
      - name: gross_margin_pct
        description: "Gross profit as % of revenue — accurate per variant, for that month"

  - name: salesperson_performance
    description: >
      Per-salesperson, per-month transaction and revenue metrics. One row per
      (month, salesperson_name), only for months that salesperson sold something.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - month
            - salesperson_name
    columns:
      - name: month
        tests: [not_null]
      - name: salesperson_name
        tests: [not_null]

  - name: expense_summary
    description: "Daily expense totals by category and business unit."
    columns:
      - name: unit
        description: "Business unit/branch. NULL for expenses recorded before this field existed."

  - name: monthly_profit
    description: >
      Monthly P&L by business unit: revenue minus returns, COGS, and
      operating expenses. One row per (month, business unit).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - month
            - unit
    columns:
      - name: unit
        description: "Business unit/branch. NULL for activity recorded before this field existed."

  - name: unit_performance
    description: >
      Per-month ranking per business unit — the primary mart for answering
      "which unit performs better this month". One row per (month, unit) —
      always all 12 units, for every month with any activity across the
      business plus the current month (so it never goes blank on the 1st).
      Excludes historical rows that predate the Business Unit field
      (unit = NULL), unlike daily_sales_summary and monthly_profit which
      include them in grand totals.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - month
            - unit
    columns:
      - name: month
        tests: [not_null]
      - name: unit
        tests: [not_null]
      - name: total_revenue
        description: "Net sales revenue attributed to this unit, for that month."
      - name: estimated_net_profit
        description: "total_revenue - total_return_value - total_cogs - total_expenses, for that month"
      - name: return_rate_pct
        description: "Units returned as a % of units sold that month — lower is better."

  - name: returns_analysis
    description: >
      Return transactions enriched with product info, business unit, return
      rates, and all dimensions needed for the Returns Analysis dashboard.
    columns:
      - name: return_id
        tests: [unique, not_null]
      - name: return_date
        tests: [not_null]
      - name: unit
        description: "Business unit/branch that processed this return. NULL for legacy rows."
      - name: return_reason
        tests:
          - accepted_values:
              values:
                - Defective
                - Wrong Item
                - Customer Changed Mind
                - Other
      - name: refund_method
        tests:
          - accepted_values:
              values: ['M-Pesa', 'Bank', 'Store Credit', 'No Refund']

  - name: customer_insights
    description: >
      Per-customer, per-month purchase summary. Phone numbers masked for
      privacy. One row per (month, customer_phone_masked) — customer_tier
      and is_repeat_customer are evaluated within that month, not lifetime.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - month
            - customer_phone_masked
    columns:
      - name: month
        tests: [not_null]
      - name: customer_phone_masked
        description: "Format: 07XX****XX"
        tests: [not_null]
