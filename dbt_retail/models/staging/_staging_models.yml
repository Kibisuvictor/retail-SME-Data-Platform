version: 2

models:

  - name: stg_products
    description: "Cleaned product master. Deduplicates by keeping latest entry per product name."
    columns:
      - name: product_key
        description: "Slugified product name — join key across all models."
        tests:
          - unique
          - not_null
      - name: product_name
        tests: [not_null]
      - name: category
        tests:
          - not_null
          - accepted_values:
              values:
                - Flooring
                - Window Treatments
                - Wall & Ceiling Decor
                - Bathroom & Balcony
                - Home Accessories
                - Hardware & Fixings
                - Other
      - name: unit_of_measure
        tests:
          - accepted_values:
              values: [Piece, Metre, "Sq Metre", Roll, Set]
      - name: selling_price
        tests: [not_null]
      - name: cost_price
        description: "Cost price per variant in KES. NULL if not entered — profit will be 0 for that product."
        tests: [not_null]
      - name: product_family
        description: "Extracted from name before ' - ' e.g. 'Locks' from 'Locks - Moment'."
      - name: product_variant
        description: "Extracted from name after ' - ' e.g. 'Moment' from 'Locks - Moment'."
      - name: unit_margin_kes
        description: "selling_price - cost_price per unit."
      - name: unit_margin_pct
        description: "Unit margin as % of selling price."
      - name: is_active
        tests: [not_null]

  - name: stg_sales
    description: "Cleaned, typed sales transactions with derived amounts."
    columns:
      - name: sale_id
        description: "MD5 surrogate key."
        tests: [unique, not_null]
      - name: sale_date
        tests: [not_null]
      - name: salesperson_name
        tests: [not_null]
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_key
      - name: units_sold
        tests: [not_null]
      - name: unit_price
        tests: [not_null]
      - name: payment_method
        tests:
          - not_null
          - accepted_values:
              values: ['M-Pesa', 'Bank']
      - name: unit
        description: >
          Business unit/branch that made this sale. NULL for sales recorded
          before this field was added to the Form — not enforced not_null
          so historical rows aren't flagged as failures.
        tests:
          - accepted_values:
              values:
                - Cosmic Choices FB & IG
                - Cosmic Choices website
                - Jesilog FB & IG
                - Jesilog Website
                - Tabasamu FB & IG
                - Tabasamu website
                - Onpoint
                - Nayomie
                - Prince
                - Hope
                - Hope & Home
                - Tsavo

  - name: stg_expenses
    description: "Cleaned expense records."
    columns:
      - name: expense_id
        tests: [unique, not_null]
      - name: expense_date
        tests: [not_null]
      - name: expense_category
        tests:
          - not_null
          - accepted_values:
              values:
                - Water
                - Stationery
                - Supplier Transport
                - Customer Delivery
                - Other
      - name: amount
        tests: [not_null]
      - name: paid_via
        tests:
          - not_null
          - accepted_values:
              values: ['M-Pesa', 'Bank']
      - name: unit
        description: "Business unit/branch this expense belongs to. NULL for legacy rows."
        tests:
          - accepted_values:
              values:
                - Cosmic Choices FB & IG
                - Cosmic Choices website
                - Jesilog FB & IG
                - Jesilog Website
                - Tabasamu FB & IG
                - Tabasamu website
                - Onpoint
                - Nayomie
                - Prince
                - Hope
                - Hope & Home
                - Tsavo

  - name: stg_returns
    description: "Cleaned return transactions from the dedicated Returns Form."
    columns:
      - name: return_id
        description: "MD5 surrogate key."
        tests: [unique, not_null]
      - name: return_date
        tests: [not_null]
      - name: salesperson_name
        tests: [not_null]
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_key
      - name: units_returned
        tests: [not_null]
      - name: original_unit_price
        tests: [not_null]
      - name: return_reason
        tests:
          - not_null
          - accepted_values:
              values:
                - Defective
                - Wrong Item
                - Customer Changed Mind
                - Other
      - name: refund_method
        tests:
          - not_null
          - accepted_values:
              values: ['M-Pesa', 'Bank', 'Store Credit', 'No Refund']
      - name: unit
        description: "Business unit/branch that processed this return. NULL for legacy rows."
        tests:
          - accepted_values:
              values:
                - Cosmic Choices FB & IG
                - Cosmic Choices website
                - Jesilog FB & IG
                - Jesilog Website
                - Tabasamu FB & IG
                - Tabasamu website
                - Onpoint
                - Nayomie
                - Prince
                - Hope
                - Hope & Home
                - Tsavo

  - name: stg_inventory_purchases
    description: "Cleaned inventory purchase records."
    columns:
      - name: purchase_id
        tests: [unique, not_null]
      - name: purchase_date
        tests: [not_null]
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_key
      - name: units_purchased
        tests: [not_null]
      - name: unit_cost
        tests: [not_null]
      - name: unit
        description: "Business unit/branch that received this stock. NULL for legacy rows."
        tests:
          - accepted_values:
              values:
                - Cosmic Choices FB & IG
                - Cosmic Choices website
                - Jesilog FB & IG
                - Jesilog Website
                - Tabasamu FB & IG
                - Tabasamu website
                - Onpoint
                - Nayomie
                - Prince
                - Hope
                - Hope & Home
                - Tsavo
