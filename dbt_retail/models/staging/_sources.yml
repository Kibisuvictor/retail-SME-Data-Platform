version: 2

sources:
  - name: retail_raw
    description: >
      External tables in BigQuery that read directly from Google Sheets.
      Column names reflect the actual Google Forms headers after BigQuery
      normalises them (spaces → underscores, special chars removed).
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: retail_raw

    tables:

      - name: sales_raw
        description: "Live read of the Sales tab. One row per form submission."
        columns:
          - name: Timestamp
            description: "Auto-generated by Google Forms on submission."
          - name: Date
            description: "Sale date entered by salesperson."
          - name: Salesperson_Name
            description: "Selected from dropdown. Original header: 'Salesperson Name'."
          - name: Product
            description: "Product sold. Selected from dropdown."
          - name: Units_Sold
            description: "Number of units. Original header: 'Units Sold'."
          - name: Unit_Price_KES
            description: "Price per unit. Original header: 'Unit Price (KES)'."
          - name: Discount_Amount_KES
            description: "Discount given. Original header: 'Discount Amount (KES)'."
          - name: Payment_Method
            description: "M-Pesa or Bank. Original header: 'Payment Method'."
          - name: Customer_Phone_Number
            description: "Optional. Original header: 'Customer Phone Number'."
          - name: Customer_Type
            description: "Customer type. Original header: 'Customer Type'."
          - name: Notes
            description: "Free text notes."

      - name: expenses_raw
        description: "Live read of the Expenses tab."
        columns:
          - name: Timestamp
            description: "Auto-generated by Google Forms."
          - name: Date_of_Expense
            description: "Date expense occurred. Original header: 'Date of Expense'."
          - name: Expense_Category
            description: "Category from dropdown. Original header: 'Expense Category'."
          - name: Amount_KES
            description: "Amount in KES. Original header: 'Amount (KES)'."
          - name: Description
            description: "What the expense was for."
          - name: Paid_Via
            description: "M-Pesa or Bank. Original header: 'Paid Via'."
          - name: Recorded_By
            description: "Who recorded it. Original header: 'Recorded By'."

      - name: inventory_purchases_raw
        description: "Live read of the Inventory Purchases tab."
        columns:
          - name: Timestamp
            description: "Auto-generated by Google Forms."
          - name: Date_of_Purchase
            description: "Date stock received. Original header: 'Date of Purchase'."
          - name: Product_Purchased
            description: "Product name. Original header: 'Product Purchased'."
          - name: Units_Purchased
            description: "Units received. Original header: 'Units Purchased'."
          - name: Unit_Cost_KES
            description: "Cost per unit. Original header: 'Unit Cost (KES)'."
          - name: Supplier_Name
            description: "Supplier name. Original header: 'Supplier Name'."
          - name: Payment_Method
            description: "M-Pesa or Bank. Original header: 'Payment Method'."
          - name: Notes_Comments
            description: "Optional notes. Original header: 'Notes/Comments (Optional)'."

      - name: returns_raw
        description: "Live read of the Returns tab."
        columns:
          - name: Timestamp
            description: "Auto-generated by Google Forms."
          - name: Date_of_Return
            description: "Date return processed. Original header: 'Date of Return'."
          - name: Salesperson_Name
            description: "Who processed the return. Original header: 'Salesperson Name'."
          - name: Product_Returned
            description: "Product returned. Original header: 'Product Returned (Select Item)'."
          - name: Units_Returned
            description: "Units returned. Original header: 'Units Returned (Must be greater than 0)'."
          - name: Original_Unit_Price_KES
            description: "Original sale price. Original header: 'Original Unit Price (KES) - What was the item sold for?'."
          - name: Reason_for_Return
            description: "Return reason. Original header: 'Reason for Return'."
          - name: Requested_Refund_Method
            description: "Refund method. Original header: 'Requested Refund Method'."
          - name: Customer_Phone_Number
            description: "Optional. Original header: 'Customer Phone Number (Optional)'."
          - name: Notes
            description: "Optional. Original header: 'Notes and Further Explanation (Optional)'."

      - name: products_raw
        description: "Live read of the Products tab."
        columns:
          - name: Timestamp
            description: "Auto-generated by Google Forms."
          - name: Product_Name
            description: "Product name. Original header: 'Product Name (Must be exact for identification purposes)'."
          - name: Category
            description: "Product category."
          - name: Unit_of_Measure
            description: "UoM. Original header: 'Unit of Measure (UoM)'."
          - name: Current_Selling_Price
            description: "Retail price in KES. Original header: 'Current Selling Price (KES)'."
          - name: Reorder_Level
            description: "Alert threshold. Original header: 'Reorder Level (units) - Default is 5'."
          - name: Is_Active
            description: "Active flag. Original header: 'Is this product currently active?'."
