name: dbt_retail
version: '1.0.0'
config-version: 2

profile: retail_gcp

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  dbt_retail:
    staging:
      +materialized: table
      +dataset: retail_staging
    marts:
      +materialized: table
      +dataset: retail_marts

seeds:
  dbt_retail:
    +dataset: retail_raw
